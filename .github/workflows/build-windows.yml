name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip show PyInstaller PySide6 PySide6-Addons SQLAlchemy

      - name: Build exe
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name FrostDepthCalculator `
            --add-data "migrations;migrations" `
            --add-data "frost_depth/ui/map_assets;frost_depth/ui/map_assets" `
            main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FrostDepthCalculator-windows
          path: dist/FrostDepthCalculator